[target.aarch64-linux-android]
linker = "D:/android-ndk-r27d/toolchains/llvm/prebuilt/windows-x86_64/bin/aarch64-linux-android24-clang.cmd"
ar = "D:/android-ndk-r27d/toolchains/llvm/prebuilt/windows-x86_64/bin/llvm-ar.exe"
rustflags = ["-L", "D:/android-libs/lib", "-lc++_static", "-lc++abi", "-lunwind"]

[alias]
build-all = "build --release --target x86_64-pc-windows-msvc --target aarch64-linux-android"

[env]
PKG_CONFIG_PATH = "D:/android-libs/lib/pkgconfig"
PKG_CONFIG_ALLOW_CROSS = "1"
LIBHEIF_STATIC = "1"
CC_aarch64_linux_android = "D:/android-ndk-r27d/toolchains/llvm/prebuilt/windows-x86_64/bin/aarch64-linux-android24-clang.cmd"
AR_aarch64_linux_android = "D:/android-ndk-r27d/toolchains/llvm/prebuilt/windows-x86_64/bin/llvm-ar.exe"
